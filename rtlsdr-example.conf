# RTL-SDR Configuration Example
# This file contains sample settings and frequencies for common radio monitoring tasks
# Copy this to rtlsdr.conf and customize for your needs

# ==============================================================================
# RTL-SDR Device Configuration
# ==============================================================================

# Device Selection (use rtl_test to find your device index)
# If you have multiple RTL-SDR devices, specify which one to use
# DEVICE_INDEX=0

# Frequency Correction (PPM)
# RTL-SDR devices often have a small frequency error
# Measure using kalibrate-rtl or GQRX and set here
# Common values: 0-100 PPM
FREQUENCY_CORRECTION=0

# Sample Rate (Hz)
# Higher sample rates allow wider bandwidth but require more CPU
# Common values: 250000, 1024000, 2048000, 2400000
# Default: 2048000 (2.048 MHz)
SAMPLE_RATE=2048000

# Gain Settings
# Auto gain: -1 (recommended for beginners)
# Manual gain: 0-49.6 dB (use rtl_test to see supported values)
# For weak signals: 40-49.6 dB
# For strong local signals: 10-20 dB
GAIN=-1

# ==============================================================================
# Common Frequency Presets (All frequencies in Hz)
# ==============================================================================

# FM Broadcast Band (Europe/World: 87.5-108 MHz, USA: 88-108 MHz)
FM_BROADCAST_START=88000000
FM_BROADCAST_END=108000000
FM_BROADCAST_STEP=100000

# Amateur Radio 2m Band (144-146 MHz)
AMATEUR_2M_START=144000000
AMATEUR_2M_END=146000000

# Amateur Radio 70cm Band (430-440 MHz)
AMATEUR_70CM_START=430000000
AMATEUR_70CM_END=440000000

# Aviation Band (118-137 MHz)
AVIATION_START=118000000
AVIATION_END=137000000

# Marine VHF (156-162 MHz)
MARINE_START=156000000
MARINE_END=162000000

# Weather Satellites (NOAA APT)
NOAA_15=137620000
NOAA_18=137912500
NOAA_19=137100000

# ==============================================================================
# APRS (Automatic Packet Reporting System) Frequencies
# ==============================================================================

# Europe APRS Frequency
APRS_EUROPE=144800000

# North America APRS Frequency
APRS_NA=144390000

# Australia APRS Frequency
APRS_AU=145175000

# ==============================================================================
# POCSAG Pager Frequencies (Common Frequencies by Region)
# ==============================================================================

# Europe Common Pager Frequencies
POCSAG_EU_1=169650000   # Common emergency services
POCSAG_EU_2=173375000   # Common commercial paging

# North America Common Pager Frequencies
POCSAG_NA_1=929600000   # Common commercial
POCSAG_NA_2=931600000   # Common commercial

# POCSAG Baud Rates: 512, 1200, 2400

# ==============================================================================
# Swiss Amateur Radio Repeater Frequencies
# ==============================================================================

# 2m Band Repeaters (144-146 MHz)
# Input: 145.000-145.800 MHz
# Output: -600 kHz offset

SWISS_2M_REPEATER_1=145000000
SWISS_2M_REPEATER_2=145025000
SWISS_2M_REPEATER_3=145050000

# 70cm Band Repeaters (430-440 MHz)
# Input: 438.000-438.975 MHz
# Output: -7.6 MHz offset

SWISS_70CM_REPEATER_1=438000000
SWISS_70CM_REPEATER_2=438025000
SWISS_70CM_REPEATER_3=438050000

# ==============================================================================
# PMR446 (Personal Mobile Radio) - Europe License-Free
# ==============================================================================

PMR446_CH1=446006250
PMR446_CH2=446018750
PMR446_CH3=446031250
PMR446_CH4=446043750
PMR446_CH5=446056250
PMR446_CH6=446068750
PMR446_CH7=446081250
PMR446_CH8=446093750

# ==============================================================================
# Usage Examples
# ==============================================================================

# Example 1: Monitor local FM radio station
# Frequency: 100.7 MHz FM
# API call:
# curl -X POST http://localhost:5000/capture-and-transcribe \
#   -H "Content-Type: application/json" \
#   -d '{"frequency": 100700000, "modulation": "fm", "duration": 30}'

# Example 2: Decode APRS packets (Europe)
# Frequency: 144.800 MHz
# API call:
# curl -X POST http://localhost:5000/aprs/decode \
#   -H "Content-Type: application/json" \
#   -d '{"frequency": 144800000, "duration": 300}'

# Example 3: Monitor aviation band
# Frequency: 121.5 MHz (Emergency)
# API call:
# curl -X POST http://localhost:5000/capture-and-transcribe \
#   -H "Content-Type: application/json" \
#   -d '{"frequency": 121500000, "modulation": "am", "duration": 60}'

# Example 4: Scan Swiss 2m repeaters
# API call:
# curl -X POST http://localhost:5000/scan-repeaters \
#   -H "Content-Type: application/json" \
#   -d '{"band": "2m", "canton": "all"}'

# ==============================================================================
# RTL-SDR Frequency Limitations
# ==============================================================================

# RTL-SDR can receive: 24 MHz - 1.766 GHz
# Cannot receive:
#   - HF bands (< 24 MHz) - Shortwave, amateur HF
#   - Microwave (> 1.766 GHz) - 23cm amateur, satellite downlinks above 1.7 GHz

# For HF reception: Consider RTL-SDR with upconverter or HackRF One
# For full spectrum: Consider HackRF One (1 MHz - 6 GHz)

# ==============================================================================
# Multi-Device Setup
# ==============================================================================

# If you have multiple RTL-SDR devices:
# 1. Use rtl_eeprom to set unique serial numbers
# 2. Use rtl_test to verify device indices
# 3. Specify device by serial number in API calls:
#
# Example:
# rtl_eeprom -d 0 -s DEVICE01
# rtl_eeprom -d 1 -s DEVICE02
#
# API call with specific device:
# curl -X POST http://localhost:5000/capture-and-transcribe \
#   -H "Content-Type: application/json" \
#   -d '{"frequency": 144800000, "device": "DEVICE01", "duration": 30}'

# ==============================================================================
# Troubleshooting
# ==============================================================================

# 1. Check if RTL-SDR is detected:
#    rtl_test -t

# 2. Test reception:
#    rtl_fm -f 100.7M -M fm -s 200k - | aplay -r 200k -f S16_LE

# 3. Check for frequency drift:
#    Use kalibrate-rtl or compare known frequency with received

# 4. Permission issues:
#    Add user to plugdev group: sudo usermod -a -G plugdev $USER

# 5. Device busy error:
#    Another application is using the RTL-SDR
#    Close GQRX, SDR#, or other SDR software
