# Kibana configuration for RadioMoni
# Credentials come from the environment (ELASTICSEARCH_USERNAME / ELASTICSEARCH_PASSWORD),
# never from this file.
server.name: radio-kibana
server.host: "0.0.0.0"
server.port: 5601
server.compression.enabled: true
server.publicBaseUrl: "http://localhost:5601"

elasticsearch.requestTimeout: 90000

i18n.locale: "en"
telemetry.optIn: false
telemetry.allowChangingOptInStatus: false

logging:
  root:
    level: info
