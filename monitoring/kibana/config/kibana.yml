# Kibana Configuration for Radio Monitoring System

# Server Settings
server.name: radio-kibana
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch Connection
elasticsearch.hosts: ["http://elasticsearch:9200"]

# Kibana Settings
kibana.index: ".kibana"
kibana.defaultAppId: "discover"

# Monitoring
monitoring.ui.container.elasticsearch.enabled: true

# Security (disabled for simplicity - enable in production)
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "radio_monitoring_kibana_encryption_key_min_32_chars"

# Logging
logging.dest: stdout
logging.silent: false
logging.quiet: false
logging.verbose: false

# Time Settings
i18n.locale: "en"

# Telemetry
telemetry.enabled: false
telemetry.optIn: false
