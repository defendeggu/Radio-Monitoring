# Metricbeat Configuration for Radio Monitoring System
# Replaces cAdvisor + Prometheus for container and system metrics

metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# System Metrics
metricbeat.modules:

# Docker Container Metrics (replaces cAdvisor)
- module: docker
  metricsets:
    - "container"
    - "cpu"
    - "diskio"
    - "healthcheck"
    - "info"
    - "memory"
    - "network"
  hosts: ["unix:///var/run/docker.sock"]
  period: 30s     # 15 s gave ~35 % of all documents (~1 GB/day in total)
  enabled: true

# Elasticsearch Cluster Metrics
- module: elasticsearch
  metricsets:
    - cluster_stats
    # no `index`: one document per index every period was ~36 % of all documents
    - index_summary
    - node
    - node_stats
  period: 30s
  hosts: ["http://elasticsearch:9200"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  enabled: true

# System Metrics
- module: system
  hostfs: "/hostfs"
  metricsets:
    - cpu
    - load
    - memory
    - network
    - process
    - process_summary
    - filesystem
  enabled: true
  period: 30s
  processes: ['.*']
  cpu.metrics: ["percentages", "normalized_percentages"]
  core.metrics: ["percentages"]

# Process-level Metrics
- module: system
  hostfs: "/hostfs"
  metricsets:
    - process
  period: 30s
  process.include_top_n:
    by_cpu: 5
    by_memory: 5

# Elasticsearch Output
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  # One data stream. ILM (metricbeat-ilm-policy, set up by scripts/setup-elk-users.sh) starts a
  # new backing index every day and deletes it after 7 days. The daily data streams of 5.9 and
  # earlier ("metricbeat-%{+yyyy.MM.dd}") had no lifecycle: ILM cannot delete the write index of
  # a data stream, so they grew without limit (~4 GB a day on a busy host before 5.9.1).
  index: "metricbeat-radiomoni"

# Index Template (rewritten on every start, so a changed lifecycle reaches Elasticsearch).
# Metricbeat creates the data stream under the template's name, so both are metricbeat-radiomoni.
# Priority above the template "metricbeat" (150, pattern metricbeat-*) of the old daily streams.
setup.template.name: "metricbeat-radiomoni"
setup.template.pattern: "metricbeat-radiomoni"
setup.template.priority: 200
setup.template.overwrite: true
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0
  index.lifecycle.name: "metricbeat-ilm-policy"

# Metricbeat's own ILM setup stays off: the policy comes from monitoring/elasticsearch/ilm-policies
setup.ilm.enabled: false

# Kibana Dashboards
setup.kibana:
  host: "http://kibana:5601"
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"

# Logging
logging.level: info
logging.to_files: false
logging.to_syslog: false

# Processors (the only top-level `processors:` key: a second one would replace this list)
processors:
  # only real disks in system.filesystem: snap images, namespaces and other virtual mounts were
  # ~90 mount points and ~21 % of all documents
  - drop_event:
      when:
        and:
          - equals:
              event.dataset: system.filesystem
          - not:
              regexp:
                system.filesystem.type: "^(ext[234]|xfs|btrfs|vfat|zfs)$"
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_host_metadata: ~
