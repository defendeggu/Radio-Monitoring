# Elasticsearch configuration for RadioMoni (single node)
cluster.name: radio-monitoring-cluster
node.name: radio-elasticsearch

network.host: 0.0.0.0
http.port: 9200

# Security: authentication on, TLS off — Elasticsearch is only reachable
# inside the Docker "backend" network (no published port).
xpack.security.enabled: true
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false

thread_pool.write.queue_size: 1000
http.max_content_length: 200mb

# Unused features (save memory)
xpack.ml.enabled: false
xpack.graph.enabled: false
xpack.watcher.enabled: false

# Disk watermarks as free space instead of percent: a single node on a shared
# disk (e.g. 100 GB, 90 % used by other things) must keep accepting data.
cluster.routing.allocation.disk.watermark.low: 3gb
cluster.routing.allocation.disk.watermark.high: 2gb
cluster.routing.allocation.disk.watermark.flood_stage: 1gb
