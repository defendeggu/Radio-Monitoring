input {
  http {
    port => 9604
    type => "system_metric"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp to now if not present
  if ![@ timestamp] {
    ruby {
      code => "event.set('@timestamp', Time.now.utc)"
    }
  }

  # Metric type detection from metric name
  if [metric_name] {
    if [metric_name] =~ /_total$/ {
      mutate {
        add_field => { "metric_type" => "counter" }
      }
    } else if [metric_name] =~ /_bucket$/ {
      mutate {
        add_field => { "metric_type" => "histogram" }
      }
    } else {
      mutate {
        add_field => { "metric_type" => "gauge" }
      }
    }
  }

  # Add service tag
  mutate {
    add_field => { "service" => "radio-monitoring-api" }
  }

  # Add index name
  mutate {
    add_field => {
      "[@metadata][index]" => "radio-metrics-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}"
  }
}
