input {
  http {
    port => 9601
    type => "aprs_message"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Build geo_point if latitude and longitude present
  if [latitude] and [longitude] {
    mutate {
      add_field => {
        "[position][lat]" => "%{latitude}"
        "[position][lon]" => "%{longitude}"
      }
    }
    mutate {
      convert => {
        "[position][lat]" => "float"
        "[position][lon]" => "float"
      }
    }
  }

  # Calculate frequency_mhz
  if [frequency] and ![frequency_mhz] {
    ruby {
      code => "event.set('frequency_mhz', event.get('frequency') / 1_000_000.0)"
    }
  }

  # Ensure UUID
  if ![uuid] {
    uuid {
      target => "uuid"
    }
  }

  # Normalize callsigns to uppercase
  if [source_callsign] {
    mutate {
      uppercase => ["source_callsign"]
    }
  }
  if [destination_callsign] {
    mutate {
      uppercase => ["destination_callsign"]
    }
  }

  # Add index name
  mutate {
    add_field => {
      "[@metadata][index]" => "radio-aprs-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
  }
}
