input {
  http {
    port => 9600
    type => "radio_capture"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp from created_at if present
  if [created_at] {
    date {
      match => ["created_at", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Calculate frequency_mhz if not already set
  if [frequency] and ![frequency_mhz] {
    ruby {
      code => "event.set('frequency_mhz', event.get('frequency') / 1_000_000.0)"
    }
  }

  # Ensure UUID exists
  if ![uuid] {
    uuid {
      target => "uuid"
    }
  }

  # Add index name with daily rollover
  mutate {
    add_field => {
      "[@metadata][index]" => "radio-captures-%{+YYYY.MM.dd}"
    }
  }

  # Remove empty fields
  prune {
    whitelist_names => ["^@", "^uuid", "^frequency", "^duration", "^modulation", "^sample_rate", "^rf_gain", "^sdr_type", "^transcription", "^detected_language", "^confidence_score", "^audio_file", "^status", "^segments", "^metadata"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
  }

  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
