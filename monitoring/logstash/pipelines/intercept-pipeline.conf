input {
  http {
    port => 9605
    type => "intercept"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp from incoming data
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Ensure decoder field exists
  if ![decoder] {
    mutate {
      add_field => { "decoder" => "unknown" }
    }
  }

  # Create geo_point from lat/lon for mapping
  if [lat] and [lon] {
    mutate {
      add_field => { "location" => "%{lat},%{lon}" }
    }
    mutate {
      convert => { "location" => "string" }
    }
  }

  # Ensure UUID for document ID
  if ![uuid] {
    uuid {
      target => "uuid"
    }
  }

  # Route to different indices based on decoder type
  if [decoder] == "pocsag" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-pocsag-%{+YYYY.MM.dd}" }
    }
  } else if [decoder] == "adsb" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-adsb-%{+YYYY.MM.dd}" }
    }
  } else if [decoder] == "acars" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-acars-%{+YYYY.MM.dd}" }
    }
  } else if [decoder] == "aprs" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-aprs-%{+YYYY.MM.dd}" }
    }
  } else if [decoder] == "sensor" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-sensor-%{+YYYY.MM.dd}" }
    }
  } else if [decoder] == "rtlamr" {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-rtlamr-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index]" => "intercept-other-%{+YYYY.MM.dd}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
  }
}
