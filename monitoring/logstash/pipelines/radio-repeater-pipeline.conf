input {
  http {
    port => 9603
    type => "repeater_activity"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp
  if [created_at] {
    date {
      match => ["created_at", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Calculate frequency_mhz
  if [frequency] and ![frequency_mhz] {
    ruby {
      code => "event.set('frequency_mhz', event.get('frequency') / 1_000_000.0)"
    }
  }

  # Ensure UUID
  if ![uuid] {
    uuid {
      target => "uuid"
    }
  }

  # Normalize canton to uppercase
  if [canton] {
    mutate {
      uppercase => ["canton"]
    }
  }

  # Add index name
  mutate {
    add_field => {
      "[@metadata][index]" => "radio-repeater-activity-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
  }
}
