input {
  http {
    port => 9602
    type => "pocsag_message"
    codec => json
    response_headers => {
      "Access-Control-Allow-Origin" => "*"
      "Content-Type" => "application/json"
    }
  }
}

filter {
  # Set @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Calculate frequency_mhz
  if [frequency] and ![frequency_mhz] {
    ruby {
      code => "event.set('frequency_mhz', event.get('frequency') / 1_000_000.0)"
    }
  }

  # Ensure UUID
  if ![uuid] {
    uuid {
      target => "uuid"
    }
  }

  # Add index name
  mutate {
    add_field => {
      "[@metadata][index]" => "radio-pocsag-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
  }
}
