# RadioMoni POCSAG pipeline
# HTTP input (basic auth) -> enrichment -> daily index radio-pocsag-YYYY.MM.dd
# The radio API is the only client; the port is not published outside Docker.

input {
  http {
    port => 9602
    codec => json
    user => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
    response_headers => { "Content-Type" => "application/json" }
  }
}

filter {
  # Drop request metadata added by the http input
  mutate { remove_field => ["headers", "http", "url", "user_agent", "host", "event", "type"] }

  if [timestamp] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
  }

  if [frequency] and ![frequency_mhz] {
    ruby { code => "event.set('frequency_mhz', event.get('frequency').to_f / 1_000_000.0)" }
  }

  if ![uuid] {
    uuid { target => "uuid" }
  }

  mutate { add_field => { "[@metadata][index]" => "radio-pocsag-%{+YYYY.MM.dd}" } }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index]}"
    document_id => "%{uuid}"
    manage_template => false
  }
}
