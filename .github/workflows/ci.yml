name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version consistency (radiomoni/version.py, README badge, frontend)
        run: python3 scripts/version.py check
      - name: Build test image (Python 3.13 + SDR tools)
        run: docker build --target test -t radiomoni-api-test .
      - name: Ruff
        run: docker run --rm radiomoni-api-test ruff check .
      - name: Mypy (strict)
        run: docker run --rm radiomoni-api-test mypy radiomoni/
      - name: Pytest (coverage >= 60 %)
        run: docker run --rm radiomoni-api-test pytest -q
      - name: pip-audit
        run: docker run --rm radiomoni-api-test pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend (lint, check, tests, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    name: Images + vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t radiomoni-api:ci .
          docker build -t radiomoni-web:ci frontend
      - name: Trivy (API image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: radiomoni-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy (web image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: radiomoni-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
