name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Verify checkout
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Test files present:"
          ls -la tests/*.py
          echo "pytest.ini coverage setting:"
          grep "cov-fail-under" pytest.ini
          echo "conftest.py has SDR mocking:"
          grep -c "mock_sdr_hardware" tests/conftest.py || echo "0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MyPy for static type checking
        run: ./scripts/run_mypy.sh

      - name: Run tests with pytest
        run: pytest

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
