name: CI Pipeline

on:
  push:
    branches: [ fork-rtlsdr-elk ]
  pull_request:
    branches: [ fork-rtlsdr-elk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Verify checkout
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "test_radio_capture.py import line:"
          head -10 tests/test_radio_capture.py | grep -E "from (sdr_hardware|radio_capture)"
          echo "pytest.ini coverage setting:"
          grep "cov-fail-under" pytest.ini

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MyPy for static type checking
        run: ./scripts/run_mypy.sh

      - name: Run tests with pytest
        run: pytest

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
