# Mosquitto Configuration for INTERCEPT -> Elasticsearch Pipeline
# =================================================================

# Listener - accept connections from Docker network and localhost
listener 1883 0.0.0.0

# Allow anonymous connections (for internal Docker network use)
# For production, set to false and configure password_file
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections -1
max_queued_messages 1000

# Message settings
message_size_limit 0
