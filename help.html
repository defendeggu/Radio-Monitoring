<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Monitoring – Benutzerhandbuch</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f6f8fa;
            color: #24292e;
            line-height: 1.6;
        }
        .topbar {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .topbar a {
            color: #90cdf4;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border: 1px solid #4a90d9;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .topbar a:hover { background: rgba(144,205,244,0.15); }
        .topbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
        .content {
            max-width: 900px;
            margin: 32px auto;
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 40px 48px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .content h1 { font-size: 2em; border-bottom: 2px solid #e1e4e8; padding-bottom: 12px; margin-bottom: 24px; }
        .content h2 { font-size: 1.5em; border-bottom: 1px solid #e1e4e8; padding-bottom: 8px; margin: 32px 0 16px; color: #2d3748; }
        .content h3 { font-size: 1.2em; margin: 24px 0 12px; color: #4a5568; }
        .content h4 { margin: 16px 0 8px; color: #666; }
        .content p { margin-bottom: 12px; }
        .content ul, .content ol { padding-left: 24px; margin-bottom: 12px; }
        .content li { margin-bottom: 4px; }
        .content code {
            background: #f3f4f6;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #e83e8c;
        }
        .content pre {
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            margin: 16px 0;
        }
        .content pre code {
            background: none;
            border: none;
            color: inherit;
            padding: 0;
            font-size: 0.88em;
        }
        .content blockquote {
            border-left: 4px solid #4a5568;
            padding: 8px 16px;
            margin: 16px 0;
            background: #f0f4f8;
            border-radius: 0 6px 6px 0;
            color: #555;
        }
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.95em;
        }
        .content th {
            background: #4a5568;
            color: white;
            padding: 10px 14px;
            text-align: left;
        }
        .content td { padding: 8px 14px; border-bottom: 1px solid #e1e4e8; }
        .content tr:nth-child(even) { background: #f6f8fa; }
        .content hr { border: none; border-top: 1px solid #e1e4e8; margin: 24px 0; }
        .content a { color: #4a90d9; text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        #loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 18px;
        }
        .spinner {
            display: inline-block;
            width: 32px; height: 32px;
            border: 4px solid #ddd;
            border-top-color: #4a5568;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/" onclick="window.close(); return false;">← Zurück zum Control Panel</a>
        <h1>📖 Benutzerhandbuch</h1>
    </div>
    <div class="content">
        <div id="loading">
            <div class="spinner"></div><br>
            Lade Handbuch…
        </div>
        <div id="manual" style="display:none"></div>
    </div>
    <script>
        fetch('/USER_MANUAL.md')
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then(md => {
                document.getElementById('loading').style.display = 'none';
                const el = document.getElementById('manual');
                el.style.display = 'block';
                el.innerHTML = marked.parse(md);
            })
            .catch(err => {
                document.getElementById('loading').innerHTML =
                    '<p style="color:#c53030">Fehler beim Laden des Handbuchs: ' + err.message + '</p>' +
                    '<p><a href="/USER_MANUAL.md">Direkt öffnen (Markdown)</a></p>';
            });
    </script>
</body>
</html>
