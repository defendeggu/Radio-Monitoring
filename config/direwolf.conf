# Direwolf Configuration for APRS Decoding
# Used by Radio Transcription System for decoding APRS packets from audio files

# Audio device configuration
# stdin/null since we're processing WAV files, not real-time audio
ADEVICE stdin null

# Number of audio channels (mono)
ACHANNELS 1

# Channel configuration
CHANNEL 0

# Station callsign (placeholder for receive-only operation)
MYCALL N0CALL

# Modem configuration
# 1200 baud AFSK (standard for VHF APRS on 144.8 MHz)
MODEM 1200

# No PTT (push-to-talk) since this is receive-only
# PTT disabled

# Error correction
# FIX_BITS 0 = no bit fixing (more reliable for clean signals)
# Can be increased (1-5) for noisy signals but may introduce false decodes
FIX_BITS 0

# Quiet mode - less verbose output
# Uncomment for debugging:
# LOGDIR /app/recordings/direwolf_logs
