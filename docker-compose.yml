# RadioMoni — Docker Compose stack
#
#   Full stack (default, COMPOSE_PROFILES=elk in .env):  docker compose up -d
#   Light (no ELK, SQLite):  COMPOSE_PROFILES= STORAGE_BACKEND=sqlite docker compose up -d
#   GPU transcription:       docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Only the web UI (nginx) is published. Kibana listens on 127.0.0.1 by default.
# Elasticsearch, Logstash, Redis and the API are reachable inside Docker only.
#
# Networks: "web" connects nginx and the API; "backend" connects the API with
# Redis and the ELK services. No other container can talk to the API.

name: radio-monitoring

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ===========================================================================
  # Elasticsearch — data storage
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.5.5}
    container_name: radio-elasticsearch
    profiles: [elk]
    <<: [*hardening, *logging]
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD missing — run scripts/setup-env.sh}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu \"elastic:$${ELASTIC_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # Logstash — ingestion pipelines (HTTP input with basic auth)
  # ===========================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-9.5.5}
    container_name: radio-logstash
    profiles: [elk]
    <<: [*hardening, *logging]
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx1g
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=logstash_writer
      - ELASTICSEARCH_PASSWORD=${LOGSTASH_WRITER_PASSWORD:?}
      - LOGSTASH_HTTP_USER=${LOGSTASH_HTTP_USER:-radio}
      - LOGSTASH_HTTP_PASSWORD=${LOGSTASH_HTTP_PASSWORD:?LOGSTASH_HTTP_PASSWORD missing — run scripts/setup-env.sh}
    volumes:
      - ./monitoring/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./monitoring/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    networks: [backend]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9606/_node/pipelines >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ===========================================================================
  # Kibana — dashboards (localhost only by default)
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.5.5}
    container_name: radio-kibana
    profiles: [elk]
    <<: [*hardening, *logging]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?}
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./monitoring/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "${KIBANA_BIND:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    networks: [backend]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ===========================================================================
  # Metricbeat — container and host metrics (needs the Docker socket)
  # ===========================================================================
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${ELK_VERSION:-9.5.5}
    container_name: radio-metricbeat
    profiles: [elk]
    <<: [*hardening, *logging]
    # root is required to read /proc, /sys and the Docker socket (all mounted read-only)
    user: root
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=beats_writer
      - ELASTICSEARCH_PASSWORD=${BEATS_WRITER_PASSWORD:?BEATS_WRITER_PASSWORD missing — run scripts/setup-env.sh}
    volumes:
      - ./monitoring/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    command: ["--strict.perms=false"]
    networks: [backend]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Filebeat — container logs → radio-logs-*
  # ===========================================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-9.5.5}
    container_name: radio-filebeat
    profiles: [elk]
    <<: [*hardening, *logging]
    user: root
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=beats_writer
      - ELASTICSEARCH_PASSWORD=${BEATS_WRITER_PASSWORD:?}
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--strict.perms=false"]
    networks: [backend]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Redis — sessions, SDR lock, events, bookmarks, rules, schedules
  # ===========================================================================
  redis:
    image: redis:8.10.2-alpine
    container_name: radio-redis
    <<: [*hardening, *logging]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD missing — run scripts/setup-env.sh}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # RadioMoni API
  # ===========================================================================
  radio-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        WITH_USRP: ${WITH_USRP:-0}
    image: radiomoni-api:latest
    container_name: radio-transcription-api
    <<: [*hardening, *logging]
    mem_limit: 4g
    memswap_limit: 6g
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop: [ALL]
    # HackRF, RTL-SDR, Airspy HF+: bind the live /dev/bus/usb instead of "devices:",
    # which only copies the nodes present at container creation (SDR lost after
    # a host reboot or replug). Access is limited by the host's udev rules (plugdev).
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./recordings:/app/recordings
      - ./captures:/app/captures
      - whisper-models:/app/models
      - api-data:/app/data
    networks: [web, backend]
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
        required: false
      logstash:
        condition: service_healthy
        required: false
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - API_KEYS=${API_KEYS:?API_KEYS missing — run scripts/setup-env.sh}
      - TRUSTED_IPS=${TRUSTED_IPS:-}
      - PROXY_COUNT=1
      - STORAGE_BACKEND=${STORAGE_BACKEND:-elasticsearch}
      - SQLITE_PATH=/app/data/radiomoni.sqlite3
      - ELASTICSEARCH_HOSTS=http://radio_api:${RADIO_API_PASSWORD:-}@elasticsearch:9200
      - LOGSTASH_HOST=http://logstash:9600
      - LOGSTASH_APRS_HOST=http://logstash:9601
      - LOGSTASH_POCSAG_HOST=http://logstash:9602
      - LOGSTASH_REPEATER_HOST=http://logstash:9603
      - LOGSTASH_HTTP_USER=${LOGSTASH_HTTP_USER:-radio}
      - LOGSTASH_HTTP_PASSWORD=${LOGSTASH_HTTP_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_INITIAL_PROMPT=${WHISPER_INITIAL_PROMPT:-}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-30}
      - MIN_FREE_DISK_MB=${MIN_FREE_DISK_MB:-500}
      - RECORDING_LINK_SECRET=${RECORDING_LINK_SECRET:-}
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-32}
    restart: unless-stopped

  # ===========================================================================
  # Web UI (Svelte build served by nginx, proxies /api/ to the API)
  # ===========================================================================
  web-interface:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: radiomoni-web:latest
    container_name: radio-web-interface
    <<: [*hardening, *logging]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  elasticsearch-data:
  redis-data:
  whisper-models:
  api-data:

networks:
  web:
  backend:
