services:
  # ===========================================================================
  # Elasticsearch - Data Storage
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: radio-elasticsearch
    env_file:
      - .env.elk
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./monitoring/elasticsearch/index-templates:/usr/share/elasticsearch/index-templates:ro
      - ./monitoring/elasticsearch/ilm-policies:/usr/share/elasticsearch/ilm-policies:ro
    ports:
      - "9200:9200"
    networks:
      - radio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Logstash - Data Ingestion Pipelines
  # ===========================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: radio-logstash
    env_file:
      - .env.elk
    volumes:
      - ./monitoring/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./monitoring/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - "9600:9600"  # radio-captures pipeline
      - "9601:9601"  # radio-aprs pipeline
      - "9602:9602"  # radio-pocsag pipeline
      - "9603:9603"  # radio-repeater pipeline
      - "9604:9604"  # radio-metrics pipeline
    environment:
      - "LS_JAVA_OPTS=-Xmx2g -Xms2g"
      - ELASTICSEARCH_USERNAME=logstash_system
      - ELASTICSEARCH_PASSWORD=${LOGSTASH_SYSTEM_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Kibana - Visualization & Dashboards
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: radio-kibana
    env_file:
      - .env.elk
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - SERVER_NAME=radio-kibana
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=min-32-byte-long-strong-encryption-key-here-for-kibana
    volumes:
      - ./monitoring/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Metricbeat - Container & System Metrics
  # ===========================================================================
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.11.3
    container_name: radio-metricbeat
    # Security: Running as root is required for system metrics collection
    # Metricbeat needs access to /proc, /sys, and Docker socket
    user: root
    env_file:
      - .env.elk
    environment:
      - ELASTICSEARCH_USERNAME=beats_system
      - ELASTICSEARCH_PASSWORD=${BEATS_SYSTEM_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - ./monitoring/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      # Security: Docker socket mounted as read-only (cannot control containers)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # System metrics sources (read-only)
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    command: ["--strict.perms=false", "-system.hostfs=/hostfs"]
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

  # ===========================================================================
  # Radio Transcription API
  # ===========================================================================
  radio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio-transcription-api
    # Security: Removed privileged mode, using explicit device access instead
    privileged: true
    env_file:
      - .env.elk
    # Memory limits to prevent OOM crashes during long captures
    mem_limit: 8g
    memswap_limit: 12g
    oom_kill_disable: false
    devices:
      # Grant access to USB bus for SDR hardware (HackRF, RTL-SDR)
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./captures:/app/captures
      - ./recordings:/app/recordings
    ports:
      - "5000:5000"
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      - LOGSTASH_HOST=http://logstash:9600
      - LOGSTASH_APRS_HOST=http://logstash:9601
      - LOGSTASH_POCSAG_HOST=http://logstash:9602
      - LOGSTASH_REPEATER_HOST=http://logstash:9603
      - LOGSTASH_METRICS_HOST=http://logstash:9604
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - API_KEYS=${API_KEYS}
      # Gunicorn configuration (optional overrides)
      - GUNICORN_WORKERS=5
      - GUNICORN_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================================================
  # Redis - Session Storage for Streaming
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: radio-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - radio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Web Interface
  # ===========================================================================
  web-interface:
    image: nginx:alpine
    container_name: radio-web-interface
    volumes:
      - ./web_interface.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8080:80"
    networks:
      - radio-network
    restart: unless-stopped

  # ===========================================================================
  # Portainer - Docker Management UI
  # ===========================================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: radio-portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"  # HTTPS UI
      - "9000:9000"  # HTTP UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - radio-network
    restart: unless-stopped

volumes:
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local
  portainer-data:
    driver: local

networks:
  radio-network:
    driver: bridge
