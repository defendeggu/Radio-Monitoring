services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: radio-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=radio_monitoring
      - POSTGRES_USER=radio_user
      - POSTGRES_PASSWORD=radio_password_change_in_production
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    restart: unless-stopped
    networks:
      - radio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio_user -d radio_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask API Service
  radio-api:
    build: .
    container_name: radio-transcription-api
    ports:
      - "5000:5000"
    volumes:
      - ./recordings:/app/recordings
      - /dev/bus/usb:/dev/bus/usb  # USB device access for HackRF
    devices:
      - /dev/bus/usb  # USB device access
    privileged: true  # Required for USB access
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - AUDIO_OUTPUT_DIR=/app/recordings
      - API_PORT=5000
      - DATABASE_URL=postgresql://radio_user:radio_password_change_in_production@postgres:5432/radio_monitoring
    restart: unless-stopped
    networks:
      - radio-network
    depends_on:
      postgres:
        condition: service_healthy

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-docker
    ports:
      - "5679:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n-workflow.json:/home/node/workflows/radio-transcription.json:ro
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    restart: unless-stopped
    networks:
      - radio-network

  # Simple web server for the HTML interface
  web-interface:
    image: nginx:alpine
    container_name: radio-web-interface
    ports:
      - "8080:80"
    volumes:
      - ./web_interface.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
    networks:
      - radio-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - radio-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - radio-network
    depends_on:
      - prometheus

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - radio-network

  # pgAdmin 4 for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    restart: unless-stopped
    networks:
      - radio-network
    depends_on:
      - postgres

networks:
  radio-network:
    driver: bridge

volumes:
  n8n-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  pgadmin-data:
