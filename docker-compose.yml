services:
  # ===========================================================================
  # Elasticsearch - Data Storage
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: radio-elasticsearch
    env_file:
      - .env.elk
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./monitoring/elasticsearch/index-templates:/usr/share/elasticsearch/index-templates:ro
      - ./monitoring/elasticsearch/ilm-policies:/usr/share/elasticsearch/ilm-policies:ro
      - ./monitoring/elasticsearch/docker-entrypoint-wrapper.sh:/usr/local/bin/entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-wrapper.sh"]
    command: ["elasticsearch"]
    secrets:
      - elasticsearch_password
    ports:
      - "9200:9200"
    networks:
      - radio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Logstash - Data Ingestion Pipelines
  # ===========================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: radio-logstash
    env_file:
      - .env.elk
    volumes:
      - ./monitoring/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./monitoring/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./monitoring/logstash/docker-entrypoint-wrapper.sh:/usr/local/bin/entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-wrapper.sh"]
    restart: on-failure
    secrets:
      - logstash_password
    ports:
      - "9600:9600"  # radio-captures pipeline
      - "9601:9601"  # radio-aprs pipeline
      - "9602:9602"  # radio-pocsag pipeline
      - "9603:9603"  # radio-repeater pipeline
      - "9604:9604"  # radio-metrics pipeline
      - "9605:9605"  # intercept pipeline
    environment:
      - "LS_JAVA_OPTS=-Xmx2g -Xms2g"
      - ELASTICSEARCH_USERNAME=logstash_writer
      - ELASTICSEARCH_PASSWORD=${LOGSTASH_WRITER_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9606 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Kibana - Visualization & Dashboards
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: radio-kibana
    env_file:
      - .env.elk
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-}
      - SERVER_NAME=radio-kibana
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    volumes:
      - ./monitoring/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./monitoring/kibana/docker-entrypoint-wrapper.sh:/usr/local/bin/entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-wrapper.sh"]
    secrets:
      - kibana_password
    ports:
      - "5601:5601"
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Metricbeat - Container & System Metrics
  # ===========================================================================
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.11.3
    container_name: radio-metricbeat
    # Security: Running as root is required for system metrics collection
    # Metricbeat needs access to /proc, /sys, and Docker socket
    user: root
    env_file:
      - .env.elk
    environment:
      - ELASTICSEARCH_USERNAME=beats_system
      - ELASTICSEARCH_PASSWORD=${BEATS_SYSTEM_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - ./monitoring/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      # Security: Docker socket mounted as read-only (cannot control containers)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # System metrics sources (read-only)
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    command: ["--strict.perms=false", "-system.hostfs=/hostfs"]
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

  # ===========================================================================
  # Radio Transcription API
  # ===========================================================================
  radio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio-transcription-api
    env_file:
      - .env.elk
    # Memory limits to prevent OOM crashes during long captures
    mem_limit: 4g
    memswap_limit: 6g
    oom_kill_disable: false
    devices:
      # Grant access to USB bus for SDR hardware (HackRF, RTL-SDR)
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./captures:/app/captures
      - ./recordings:/app/recordings
    ports:
      - "5000:5000"
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      - LOGSTASH_HOST=http://logstash:9600
      - LOGSTASH_APRS_HOST=http://logstash:9601
      - LOGSTASH_POCSAG_HOST=http://logstash:9602
      - LOGSTASH_REPEATER_HOST=http://logstash:9603
      - LOGSTASH_METRICS_HOST=http://logstash:9604
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - API_KEYS=${API_KEYS}
      # Gunicorn configuration (optional overrides)
      - GUNICORN_WORKERS=5
      - GUNICORN_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================================================
  # Redis - Session Storage for Streaming
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: radio-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - radio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Mosquitto MQTT Broker - For Intercept Integration
  # ===========================================================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: radio-mosquitto
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - radio-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # MQTT to Logstash Bridge - Forwards Intercept data to Elasticsearch
  # ===========================================================================
  mqtt-bridge:
    build:
      context: .
      dockerfile: mqtt-bridge/Dockerfile
    container_name: radio-mqtt-bridge
    volumes:
      - ./scripts/mqtt_to_logstash_bridge.py:/app/mqtt_to_logstash_bridge.py:ro
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=intercept/#
      - LOGSTASH_URL=http://logstash:9605
    networks:
      - radio-network
    depends_on:
      mosquitto:
        condition: service_healthy
      logstash:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Filebeat - Container Log Collection
  # ===========================================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: radio-filebeat
    user: root
    env_file:
      - .env.elk
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--strict.perms=false"]
    networks:
      - radio-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Web Interface
  # ===========================================================================
  web-interface:
    image: nginx:alpine
    container_name: radio-web-interface
    volumes:
      - ./web_interface.html:/usr/share/nginx/html/index.html:ro
      - ./help.html:/usr/share/nginx/html/help.html:ro
      - ./USER_MANUAL.md:/usr/share/nginx/html/USER_MANUAL.md:ro
      - ./monitoring/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - radio-network
    restart: unless-stopped

  # ===========================================================================
  # Portainer - Docker Management UI
  # ===========================================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: radio-portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"  # HTTPS UI
      - "9000:9000"  # HTTP UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - radio-network
    restart: unless-stopped

volumes:
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local
  portainer-data:
    driver: local

networks:
  radio-network:
    driver: bridge

# Docker Secrets for secure credential management
secrets:
  elasticsearch_password:
    file: ./.secrets/elasticsearch_password.txt
  kibana_password:
    file: ./.secrets/kibana_password.txt
  logstash_password:
    file: ./.secrets/logstash_password.txt
  beats_password:
    file: ./.secrets/beats_password.txt
