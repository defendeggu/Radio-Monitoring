# OnAir's own page (waterfall, Listen, telemetry) on its own port, passed on to the OnAir
# container (compose profile "onair"). It needs OnAir's token (?token=..., see the OnAir page in
# RadioMoni). A port of its own because the OnAir page uses /api/v1/... at the root.
# Without the OnAir container the answer is 502.
server {
  listen 8765;
  listen [::]:8765;
  server_name _;
  server_tokens off;

  location / {
    set $onair http://onair:8765;
    proxy_pass $onair;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # with the port: OnAir compares the Origin of its WebSocket with the Host and refuses a mismatch
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
