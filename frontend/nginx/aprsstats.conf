# aprs-stats' own page (map, heatmap, trips, municipalities, import, beacons) on its own port,
# passed on to the aprs-stats container (compose profile "aprsstats"). aprs-stats has no login:
# the port is bound to 127.0.0.1 unless APRSSTATS_BIND says otherwise.
# Without the aprs-stats containers the answer is 502.
server {
  listen 8092;
  listen [::]:8092;
  server_name _;
  server_tokens off;
  client_max_body_size 60m;   # aprs.fi exports, up to 50 MB per file

  location / {
    set $aprsstats http://aprsstats-web:8000;
    proxy_pass $aprsstats;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
