[project]
name = "radiomoni"
dynamic = ["version"]
requires-python = ">=3.13"
description = "SDR radio monitoring: capture, decode, transcribe, search"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["frontend", "monitoring"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = [
    "S101",   # assert is fine (internal invariants, tests)
    "S603",   # subprocess with list args (no shell) is intended
    "S607",   # SDR tools are resolved via PATH
    "S108",   # /tmp paths in tests
    "S104",   # binding 0.0.0.0 inside the container is intended
    "B008",
    "UP006", "UP007", "UP017", "UP024", "UP035", "UP045", "UP047", "UP008",
    "E501",
    "B904",   # ApiError re-raised inside except blocks on purpose
    "S110",   # best-effort cleanup (process kill, pipe close)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=60",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "hardware: Tests requiring HackRF hardware",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/venv/*",
    "*/tests/*",
    "*/site-packages/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "scipy.*", "flask.*", "fakeredis.*", "pyais.*", "apscheduler.*"]
ignore_missing_imports = true
